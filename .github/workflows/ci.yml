name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  pack:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run --workspaces
      - name: Smoke-test the packed CLI
        run: |
          set -euo pipefail
          npm pack --workspace @agent-corpus/pr-watch --pack-destination "$RUNNER_TEMP"
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/agent-corpus-pr-watch-*.tgz
          npx pr-watch --version
          npx pr-watch usage --json | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"

  changeset-check:
    name: Changeset present (info)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report whether this PR carries a changeset
        run: npx changeset status --since=origin/${{ github.base_ref }} || echo "::notice::No changeset found. Add one with 'npm run changeset' if this changes a published package."
